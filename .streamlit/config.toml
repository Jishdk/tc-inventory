# Streamlit-thema voor de beurs-app (en het dashboard).
#
# Dark-first, volgens de TC-huisstijl: surface-page als achtergrond, text-primary
# als tekst, TC-rood als primaryColor. De eigen CSS in beurs_app.py bouwt daarop
# verder met de card-surfaces en de glows.
#
# Let op: de app wordt op een beursvloer bij daglicht gebruikt. Donker leest daar
# lastiger dan licht; dat is een bewuste keuze voor de huisstijl. Valt het in de
# praktijk tegen, dan is dit bestand het enige dat terug hoeft — zet base op
# "light" en de oude waarden staan in de git-historie.
#
# Streamlit leest dit uit de werkmap van de app; op Streamlit Cloud is dat de
# repo-root.

[theme]
base = "dark"
primaryColor = "#F20519"           # TC primary red — de hoofdactie
backgroundColor = "#111318"        # surface-page
secondaryBackgroundColor = "#1A1D26"   # surface-card
textColor = "#EDEFF4"              # text-primary

# Bewust géén Luckiest Guy: dit is een interne app op een druk scherm, waar
# leesbaarheid onder tijdsdruk voorgaat op brand-flair.
font = "sans serif"
